# Ruff, the pytest suite on Python 3.12 and a workflow lint come from
# ChiefGyk3D/git-your-ship-together. The Chromium render of both sites needs
# Node and Playwright, so it stays here.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ChiefGyk3D/git-your-ship-together/.github/workflows/python-ci.yml@9d6825dd4e0e4d524fca3733f416437bbd7851e1 # v1.31.0
    permissions:
      contents: read
      id-token: write   # coverage upload job; the reusable workflow requests it
    with:
      python-versions: '["3.12"]'
      coverage-python-version: "3.12"
      lint-python-version: "3.12"
      # Standard library only; pytest is the one install.
      install-command: python -m pip install --quiet pytest
      test-command: python -m pytest -q
      docker-build: false
      egress-policy: block

  render:
    name: Render both sites in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/render.mjs
